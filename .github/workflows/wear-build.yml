name: Wear OS build

on:
  push:
    branches: [wear-os-port]
    paths: ["wear/**", ".github/workflows/wear-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: wear
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: localsend-wear-debug
          path: wear/app/build/outputs/apk/debug/*.apk
